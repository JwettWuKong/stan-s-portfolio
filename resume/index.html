<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stanley Etienne — Resume</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --navy: #1F3864;
    --navy-light: #2c4d8a;
    --bg: #f4f5f7;
    --panel: #ffffff;
    --text: #1a1a1a;
    --muted: #666a72;
    --border: #dfe2e7;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Calibri, Arial, sans-serif; }

  .header {
    background: var(--navy);
    color: #fff;
    padding: 20px 20px 16px;
    text-align: center;
  }
  .header h1 { margin: 0 0 4px 0; font-size: 20px; font-weight: 700; letter-spacing: 0.5px; }
  .header p { margin: 0; font-size: 13px; color: #cdd6ea; }

  .picker {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    padding: 14px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  .picker button {
    background: #fff;
    color: var(--text);
    border: 1px solid var(--border);
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .picker button:hover { border-color: var(--navy-light); }
  .picker button.active {
    background: var(--navy);
    border-color: var(--navy);
    color: #fff;
    font-weight: 600;
  }

  .action-bar {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
    padding: 14px 16px;
    background: var(--bg);
  }
  .action-bar a {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    padding: 10px 18px;
    border-radius: 6px;
  }
  .btn-primary { background: var(--navy); color: #fff; }
  .btn-primary:hover { background: var(--navy-light); }
  .btn-secondary { background: #fff; color: var(--navy); border: 1px solid var(--navy); }
  .btn-secondary:hover { background: #eef1f8; }

  .hint {
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    padding: 0 16px 12px;
  }

  .viewer-wrap {
    max-width: 900px;
    margin: 0 auto 24px;
    padding: 0 16px;
  }
  .viewer-frame {
    width: 100%;
    height: 80vh;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #fff;
    display: block;
  }

  @media (max-width: 480px) {
    .header h1 { font-size: 17px; }
    .picker button { font-size: 13px; padding: 7px 12px; }
    .action-bar a { font-size: 13px; padding: 9px 14px; }
  }
</style>
</head>
<body>

  <div class="header">
    <h1>Stanley Etienne</h1>
    <p>Choose the resume version that fits the role you're looking for</p>
  </div>

  <div class="picker" id="picker"></div>

  <div class="action-bar">
    <a id="open-link" class="btn-primary" href="#" target="_blank" rel="noopener">Open Resume ↗</a>
    <a id="download-link" class="btn-secondary" href="#" download>Download PDF</a>
  </div>
  <p class="hint">If the preview below doesn't load on your device, use "Open Resume" above — it works everywhere.</p>

  <div class="viewer-wrap">
    <iframe id="viewer" class="viewer-frame" src="" title="Resume preview"></iframe>
  </div>

  <script>
    // Add a new entry here any time a new tailored resume PDF is added to this folder.
    const resumes = [
      { label: "General", file: "resume-general.pdf" },
      { label: "Software Engineer", file: "resume-software-engineer.pdf" }
    ];

    const picker = document.getElementById("picker");
    const viewer = document.getElementById("viewer");
    const openLink = document.getElementById("open-link");
    const downloadLink = document.getElementById("download-link");

    function selectResume(index) {
      const r = resumes[index];
      viewer.src = r.file;
      openLink.href = r.file;
      downloadLink.href = r.file;
      [...picker.children].forEach((btn, i) => {
        btn.classList.toggle("active", i === index);
      });
      history.replaceState(null, "", "#" + encodeURIComponent(r.label.toLowerCase().replace(/\s+/g, "-")));
    }

    resumes.forEach((r, i) => {
      const btn = document.createElement("button");
      btn.textContent = r.label;
      btn.addEventListener("click", () => selectResume(i));
      picker.appendChild(btn);
    });

    let initialIndex = 0;
    const hash = decodeURIComponent(location.hash.replace("#", ""));
    if (hash) {
      const found = resumes.findIndex(r => r.label.toLowerCase().replace(/\s+/g, "-") === hash);
      if (found !== -1) initialIndex = found;
    }
    selectResume(initialIndex);
  </script>

</body>
</html>
