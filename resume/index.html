<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stanley Etienne — Resume</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --navy: #1F3864;
    --navy-light: #2c4d8a;
    --bg: #16181d;
    --panel: #1f232b;
    --text: #e8e8e8;
    --muted: #9aa0aa;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Calibri, Arial, sans-serif; }
  .header {
    background: var(--navy);
    color: #fff;
    padding: 18px 20px;
    text-align: center;
  }
  .header h1 { margin: 0 0 4px 0; font-size: 20px; font-weight: 700; letter-spacing: 0.5px; }
  .header p { margin: 0; font-size: 13px; color: #cdd6ea; }

  .picker {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    padding: 14px 16px;
    background: var(--panel);
    border-bottom: 1px solid #2a2f3a;
  }
  .picker button {
    background: transparent;
    color: var(--text);
    border: 1px solid #3a4050;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .picker button:hover { border-color: var(--navy-light); }
  .picker button.active {
    background: var(--navy);
    border-color: var(--navy);
    color: #fff;
    font-weight: 600;
  }

  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 16px;
    background: #12141a;
  }
  .toolbar span { color: var(--muted); font-size: 13px; }
  .toolbar a {
    color: #fff;
    background: var(--navy);
    text-decoration: none;
    font-size: 13px;
    padding: 6px 14px;
    border-radius: 4px;
  }
  .toolbar a:hover { background: var(--navy-light); }

  .viewer-wrap { height: calc(100vh - 128px); }
  embed { width: 100%; height: 100%; border: none; display: block; }

  @media (max-width: 480px) {
    .header h1 { font-size: 17px; }
    .picker button { font-size: 13px; padding: 7px 12px; }
  }
</style>
</head>
<body>

  <div class="header">
    <h1>Stanley Etienne</h1>
    <p>Choose the resume version that fits the role you're looking for</p>
  </div>

  <div class="picker" id="picker"></div>

  <div class="toolbar">
    <span id="current-label">Loading…</span>
    <a id="download-link" href="#" download>Download PDF</a>
  </div>

  <div class="viewer-wrap">
    <embed id="viewer" src="" type="application/pdf" />
  </div>

  <script>
    // Add a new entry here any time a new tailored resume PDF is added to this folder.
    const resumes = [
      { label: "General", file: "resume-general.pdf" },
      { label: "Software Engineer", file: "Resume_Stanley_Etienne_Software_Engineer_2026-09.pdf" }
    ];

    const picker = document.getElementById("picker");
    const viewer = document.getElementById("viewer");
    const downloadLink = document.getElementById("download-link");
    const currentLabel = document.getElementById("current-label");

    function selectResume(index) {
      const r = resumes[index];
      viewer.src = r.file;
      downloadLink.href = r.file;
      currentLabel.textContent = r.label + " resume";
      [...picker.children].forEach((btn, i) => {
        btn.classList.toggle("active", i === index);
      });
      history.replaceState(null, "", "#" + encodeURIComponent(r.label.toLowerCase().replace(/\s+/g, "-")));
    }

    resumes.forEach((r, i) => {
      const btn = document.createElement("button");
      btn.textContent = r.label;
      btn.addEventListener("click", () => selectResume(i));
      picker.appendChild(btn);
    });

    // Pick initial resume based on URL hash, else default to first in the list.
    let initialIndex = 0;
    const hash = decodeURIComponent(location.hash.replace("#", ""));
    if (hash) {
      const found = resumes.findIndex(r => r.label.toLowerCase().replace(/\s+/g, "-") === hash);
      if (found !== -1) initialIndex = found;
    }
    selectResume(initialIndex);
  </script>

</body>
</html>
